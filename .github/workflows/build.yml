name: Build Android and Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create . --platforms=android,web --project-name deewan_e_sukhan

      - name: Get dependencies
        run: flutter pub get

      - name: Set Android compileSdk 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: deewan-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build website
        run: flutter build web --release --base-href /deewan_e_sukhan/

      - name: Save website
        uses: actions/upload-artifact@v4
        with:
          name: deewan-web
          path: build/web/

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        
