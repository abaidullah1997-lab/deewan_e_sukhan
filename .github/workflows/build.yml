name: Build Android and Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create . --platforms=android,web --project-name deewan_e_sukhan
      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          import re
          s, count = re.subn(r'android:label="[^"]*"', 'android:label="دیوانِ عبید"', s, count=1)
          if count != 1:
              raise SystemExit("Android app label not found")
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Set Android compileSdk 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi
      - name: Fix file_picker compileSdk
        run: |
          FILE_PICKER_DIR=$(find "$HOME/.pub-cache" -type d -name "file_picker-*" | head -n 1)
          if [ -z "$FILE_PICKER_DIR" ]; then
            echo "file_picker package not found"
            exit 1
          fi
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk 36/' "$FILE_PICKER_DIR/android/build.gradle"
      - name: Build Android APK
        run: flutter build apk --debug

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: deewan-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build website
        run: flutter build web --release --base-href /deewan_e_sukhan/

      - name: Save website
        uses: actions/upload-artifact@v4
        with:
          name: deewan-web
          path: build/web/

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        
