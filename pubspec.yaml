name: deewan_e_sukhan
description: Urdu poetry app for Android and Web
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  image: ^4.12.0
  gal: ^2.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/ubaid.jpg

  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: "assets/fonts/jameel-noori-nastaleeq-regular_ufonts.com (2).ttf"
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ubaid.jpg"
